<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Royale Arena</title>
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #0a0e27;
      color: white;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      border: 3px solid #ff6b35;
      background: #0f1729;
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.3);
    }

    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
      font-size: 16px;
      z-index: 5;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
    }

    .minimap {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
      height: 120px;
      border: 2px solid #ff6b35;
      background: rgba(0,0,0,0.7);
      z-index: 5;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud">
    Health: 100 | Ammo: 30 | Players: 10 | Zone: Safe
  </div>
  <canvas id="minimap" class="minimap" width="120" height="120"></canvas>
  <canvas id="game" width="1000" height="600"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const minimapCanvas = document.getElementById("minimap");
    const ctx = canvas.getContext("2d");
    const minimapCtx = minimapCanvas.getContext("2d");
    const hud = document.getElementById("hud");

    // Map size
    const MAP_WIDTH = 4000;
    const MAP_HEIGHT = 4000;

    let keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

    const player = {
      x: MAP_WIDTH / 2,
      y: MAP_HEIGHT / 2,
      size: 16,
      speed: 3.5,
      health: 100,
      maxHealth: 100,
      ammo: 30,
      maxAmmo: 30,
      fireCooldown: 0
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let loot = [];
    let score = 0;
    let gameOver = false;
    let cameraX = player.x;
    let cameraY = player.y;

    // Storm/Zone
    let stormCenter = { x: MAP_WIDTH / 2, y: MAP_HEIGHT / 2 };
    let stormRadius = 1200;
    let stormDamage = 0;
    let zonePhase = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function shoot() {
      if (gameOver || player.fireCooldown > 0 || player.ammo <= 0) return;

      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

      bullets.push({
        x: player.x + Math.cos(angle) * 20,
        y: player.y + Math.sin(angle) * 20,
        vx: Math.cos(angle) * 10,
        vy: Math.sin(angle) * 10,
        size: 4
      });

      player.ammo--;
      player.fireCooldown = 0.12;
    }

    function spawnEnemy() {
      let x = Math.random() * MAP_WIDTH;
      let y = Math.random() * MAP_HEIGHT;

      enemies.push({
        x,
        y,
        size: 14 + Math.random() * 8,
        speed: 1 + Math.random() * 1.2,
        health: 1,
        ammo: 20 + Math.floor(Math.random() * 20),
        targetAngle: Math.random() * Math.PI * 2
      });
    }

    function spawnLoot(x, y) {
      const lootTypes = ["ammo", "health", "ammo"];
      const type = lootTypes[Math.floor(Math.random() * lootTypes.length)];

      loot.push({
        x,
        y,
        type,
        size: 8,
        collected: false
      });
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 20 + Math.random() * 30,
          color
        });
      }
    }

    function update(dt) {
      if (gameOver) return;

      // Player movement
      let moveX = 0;
      let moveY = 0;

      if (keys["w"] || keys["arrowup"]) moveY -= 1;
      if (keys["s"] || keys["arrowdown"]) moveY += 1;
      if (keys["a"] || keys["arrowleft"]) moveX -= 1;
      if (keys["d"] || keys["arrowright"]) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const length = Math.hypot(moveX, moveY) || 1;
        player.x += (moveX / length) * player.speed * dt * 60;
        player.y += (moveY / length) * player.speed * dt * 60;
      }

      player.x = clamp(player.x, 20, MAP_WIDTH - 20);
      player.y = clamp(player.y, 20, MAP_HEIGHT - 20);

      // Camera follow
      cameraX = player.x - canvas.width / 2;
      cameraY = player.y - canvas.height / 2;
      cameraX = clamp(cameraX, 0, MAP_WIDTH - canvas.width);
      cameraY = clamp(cameraY, 0, MAP_HEIGHT - canvas.height);

      if (mouse.down || keys[" "]) shoot();
      player.fireCooldown = Math.max(0, player.fireCooldown - dt);

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].x += bullets[i].vx * dt * 60;
        bullets[i].y += bullets[i].vy * dt * 60;

        if (bullets[i].x < 0 || bullets[i].x > MAP_WIDTH ||
            bullets[i].y < 0 || bullets[i].y > MAP_HEIGHT) {
          bullets.splice(i, 1);
          continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
          if (dist(bullets[i], enemies[j]) < bullets[i].size + enemies[j].size) {
            enemies[j].health -= 1;
            bullets.splice(i, 1);

            if (enemies[j].health <= 0) {
              spawnLoot(enemies[j].x, enemies[j].y);
              enemies.splice(j, 1);
              score += 10;
              createParticles(enemies[j].x, enemies[j].y, "#34d399", 20);
            }
            break;
          }
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const angleDiff = Math.atan2(player.y - enemy.y, player.x - enemy.x) - enemy.targetAngle;

        if (Math.random() < 0.05) {
          enemy.targetAngle += (Math.random() - 0.5) * 0.5;
        }

        enemy.x += Math.cos(enemy.targetAngle) * enemy.speed * dt * 60;
        enemy.y += Math.sin(enemy.targetAngle) * enemy.speed * dt * 60;

        if (dist(player, enemy) < player.size + enemy.size) {
          player.health -= 12;
          createParticles(enemy.x, enemy.y, "#ff4d4d", 18);
          enemies.splice(i, 1);

          if (player.health <= 0) {
            gameOver = true;
          }
        }
      }

      // Loot collection
      for (let i = loot.length - 1; i >= 0; i--) {
        if (dist(player, loot[i]) < player.size + loot[i].size + 20) {
          if (loot[i].type === "ammo") {
            player.ammo = Math.min(player.maxAmmo, player.ammo + 15);
          } else if (loot[i].type === "health") {
            player.health = Math.min(player.maxHealth, player.health + 30);
          }
          loot.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].x += particles[i].vx * dt * 60;
        particles[i].y += particles[i].vy * dt * 60;
        particles[i].life -= dt * 60;
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      // Storm damage
      const distToStorm = dist(player, stormCenter);
      if (distToStorm > stormRadius) {
        player.health -= 8 * dt * 60;
        stormDamage = Math.min(1, stormDamage + dt * 0.5);
      } else {
        stormDamage = Math.max(0, stormDamage - dt * 0.3);
      }

      if (player.health <= 0) {
        gameOver = true;
      }

      // Spawn enemies
      if (Math.random() < 0.01 && enemies.length < 12) {
        spawnEnemy();
      }

      // Shrink storm periodically
      if (Math.random() < 0.002) {
        zonePhase++;
        stormRadius = Math.max(300, stormRadius * 0.85);
        stormCenter.x += (Math.random() - 0.5) * 600;
        stormCenter.y += (Math.random() - 0.5) * 600;
      }

      hud.textContent = `Health: ${Math.ceil(player.health)} | Ammo: ${player.ammo} | Players: ${enemies.length + 1} | Zone: ${zonePhase}`;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Map background
      ctx.fillStyle = "#0f1729";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      ctx.lineWidth = 1;
      for (let x = -cameraX % 60; x < canvas.width; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = -cameraY % 60; y < canvas.height; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Storm ring
      ctx.strokeStyle = `rgba(255, 100, 50, ${0.3 + stormDamage * 0.3})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(stormCenter.x - cameraX, stormCenter.y - cameraY, stormRadius, 0, Math.PI * 2);
      ctx.stroke();

      // Loot
      for (const l of loot) {
        ctx.fillStyle = l.type === "ammo" ? "#fbbf24" : "#34d399";
        ctx.fillRect(l.x - cameraX - 6, l.y - cameraY - 6, 12, 12);
      }

      // Bullets
      for (const b of bullets) {
        ctx.fillStyle = "#fbbf24";
        ctx.fillRect(b.x - cameraX - 2, b.y - cameraY - 2, 4, 4);
      }

      // Enemies
      for (const e of enemies) {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(e.x - cameraX - e.size / 2, e.y - cameraY - e.size / 2, e.size, e.size);
      }

      // Particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillRect(p.x - cameraX - 2, p.y - cameraY - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // Player
      ctx.fillStyle = "#3b82f6";
      ctx.fillRect(player.x - cameraX - player.size / 2, player.y - cameraY - player.size / 2, player.size, player.size);

      // Aim line
      const angle = Math.atan2(mouse.y - (player.y - cameraY), mouse.x - (player.x - cameraX));
      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(player.x - cameraX, player.y - cameraY);
      ctx.lineTo(player.x - cameraX + Math.cos(angle) * 24, player.y - cameraY + Math.sin(angle) * 24);
      ctx.stroke();

      // Minimap
      minimapCtx.fillStyle = "#0a0e27";
      minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

      const scale = minimapCanvas.width / MAP_WIDTH;

      // Minimap storm
      minimapCtx.strokeStyle = "rgba(255, 100, 50, 0.6)";
      minimapCtx.lineWidth = 1;
      minimapCtx.beginPath();
      minimapCtx.arc(stormCenter.x * scale, stormCenter.y * scale, stormRadius * scale, 0, Math.PI * 2);
      minimapCtx.stroke();

      // Minimap player
      minimapCtx.fillStyle = "#3b82f6";
      minimapCtx.fillRect(player.x * scale - 2, player.y * scale - 2, 4, 4);

      // Minimap enemies
      minimapCtx.fillStyle = "#ef4444";
      for (const e of enemies) {
        minimapCtx.fillRect(e.x * scale - 1, e.y * scale - 1, 2, 2);
      }

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 48px Arial";
        ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "24px Arial";
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        ctx.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    let lastTime = 0;
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (e) => {
      keys[e.key.toLowerCase()] = true;

      if (e.key.toLowerCase() === "r" && gameOver) {
        location.reload();
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * canvas.width;
      mouse.y = ((e.clientY - rect.top) / rect.height) * canvas.height;
    });

    canvas.addEventListener("mousedown", () => {
      mouse.down = true;
    });

    window.addEventListener("mouseup", () => {
      mouse.down = false;
    });

    // Spawn initial enemies
    for (let i = 0; i < 3; i++) spawnEnemy();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
